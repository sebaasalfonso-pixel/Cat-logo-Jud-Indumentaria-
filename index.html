    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #f8fafc; color: #0f172a; min-height: 100vh; display: flex; flex-direction: column; width: 100%; overflow-x: hidden; padding-bottom: 75px; }

    /* Barra Superior Informativa */
    .top-bar { background: #0f172a; font-size: 0.72rem; color: #94a3b8; padding: 0.45rem 1rem; text-align: center; }

    /* Encabezado Principal Sticky */

    .nav-wrap { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; color: inherit; }
    .brand img { width: 38px; height: 38px; border-radius: 50%; background: #000; padding: 2px; }
    .brand-title { font-family: 'Cinzel', serif; font-size: 1.15rem; font-weight: 700; line-height: 1; }
    .brand-sub { font-size: 0.56rem; color: #64748b; letter-spacing: 0.16em; font-weight: 600; }
    
    .header-actions { display: flex; align-items: center; gap: 0.45rem; }
    .btn-social { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.45rem 0.75rem; border-radius: 50px; font-size: 0.76rem; font-weight: 700; text-decoration: none; border: 1px solid #e2e8f0; background: #fff; color: #0f172a; transition: all 0.2s; }
    .btn-social.ig { color: #d62976; border-color: #fbcfe8; background: #fff1f2; }
    .btn-cart { background: #0f172a; color: #fff; border: none; padding: 0.48rem 0.9rem; border-radius: 50px; font-weight: 700; font-size: 0.78rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.35rem; }

    /* Portada / Hero */
    .hero { text-align: center; padding: 1.1rem 1rem 0.4rem; }
    .hero h1 { font-family: 'Cinzel', serif; font-size: 1.35rem; margin-bottom: 0.2rem; }
    .hero p { font-size: 0.8rem; color: #64748b; margin-bottom: 0.45rem; }
    .badge { display: inline-block; background: #e0f2fe; color: #0369a1; font-size: 0.7rem; padding: 0.2rem 0.65rem; border-radius: 50px; font-weight: 700; }

    /* Accesos Rápidos de Contacto */
    .direct-channels { max-width: 1200px; margin: 0.4rem auto; padding: 0 1rem; display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }
    .channel-pill { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.45rem 0.9rem; border-radius: 50px; font-size: 0.76rem; font-weight: 700; text-decoration: none; transition: transform 0.15s; }
    .channel-pill:active { transform: scale(0.96); }
    .channel-wa { background: #25d366; color: #ffffff; }
    .channel-ig { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: #ffffff; }
